packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@fastify/type-provider-typebox": ^6.1.0
  "@types/node": ^24
  fastify: ^5.12.4
  tsx: ^4.23.13
  typebox: ^1.3.30
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: set this to true or false
